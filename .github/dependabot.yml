version: 2
updates:
  # Cargo has to be pointed at the workspace root, not at crates/muxox.
  # Dependabot only checks out the configured directory, and every member
  # manifest inherits edition/version/license from [workspace.package] --
  # so from inside crates/muxox there is no workspace root to inherit from
  # and the manifest fails to parse. The root is also where the only real
  # Cargo.lock lives; member lockfiles are ignored by cargo entirely.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    assignees:
      - "geoffsee"
    labels:
      - "dependencies"
    # Two PRs per week, maximum: one safe, one that needs reading.
    #
    # Majors are grouped rather than ignored. Ignoring them suppresses
    # security advisories whose only fix is a major bump -- that is how the
    # lru IterMut advisory stayed hidden for six months. Grouping keeps them
    # visible while collapsing what would otherwise be one PR per crate
    # (dropping the old ignore rule surfaced five at once).
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "deps"
      include: "scope"

# Deliberately not configured here:
#
#   ignore: version-update:semver-major
#     Ignore conditions apply to security updates too, not just version
#     updates. A blanket major-version ignore silently suppresses any
#     advisory whose only fix is a major bump -- which is what happened
#     with the lru IterMut advisory: the fix required ratatui 0.28 -> 0.30,
#     so Dependabot had nothing in-range to offer and stayed quiet.
#
#   a second "security only" ecosystem entry
#     There is no allow/update-types value that means "security"; the only
#     legal values are version-update:semver-{patch,minor,major}, which is
#     what made this file fail validation. Security updates are a separate
#     mechanism enabled in repo settings and are not scheduled here -- they
#     open as soon as an advisory lands, independent of `schedule`.
#
#   reviewers:
#     Removed from the Dependabot schema; use CODEOWNERS for review routing.
