name: Auto Tag

# Cuts a release tag when dependencies change on master -- primarily so
# Dependabot security updates ship to users instead of sitting in the repo.
#
# Order matters: the version bump is committed to master FIRST, and the tag
# is placed on that commit. release.yml checks out the tag, so a tag pushed
# ahead of its bump builds the previous version and cargo publish fails on
# an already-published version.
#
# Requires a RELEASE_TOKEN secret. Tags pushed with the default GITHUB_TOKEN
# do not trigger `on: push: tags`, so release.yml would never fire and the
# tag would just sit there unreleased.
#
# The token needs exactly one thing: write access to repository contents.
#   - Fine-grained PAT: Contents -> Read and write, scoped to this repo
#   - Classic PAT:      public_repo (muxox is public; `repo` if that changes)
#   - GitHub App:       Contents: Read and write, installed on this repo
#
# It does NOT need the workflows scope -- the bump commit only touches
# Cargo.toml, Cargo.lock and npm/package.json, never .github/workflows/.
# It does not need any other scope either; crates.io publishing is handled
# by release.yml over OIDC trusted publishing, not by this token.

on:
  push:
    branches: [master]
    paths:
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which component to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: auto-tag
  cancel-in-progress: false

# Pushing is done with RELEASE_TOKEN, so the job's own GITHUB_TOKEN needs
# nothing beyond reading the repo.
permissions:
  contents: read

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    # The bump commit touches Cargo.lock, which is this workflow's own path
    # filter -- without this it would retrigger itself forever.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fail early if RELEASE_TOKEN is missing
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. A tag pushed with the default" \
                 "GITHUB_TOKEN will not trigger release.yml, so the release would" \
                 "silently never run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Rust
        run: rustup update stable && rustup default stable

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          # Read [workspace.package] version specifically. A bare "first
          # version = line" match would be fragile if the file grows.
          CURRENT=$(awk '
            /^\[workspace\.package\]/ { in_block = 1; next }
            /^\[/                     { in_block = 0 }
            in_block && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)

          if [ -z "$CURRENT" ]; then
            echo "::error::could not read version from [workspace.package] in Cargo.toml"
            exit 1
          fi

          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::unknown bump type: $BUMP"; exit 1 ;;
          esac

          NEXT="$MAJOR.$MINOR.$PATCH"

          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::tag v$NEXT already exists"
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"       >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEXT ($BUMP)"

      - name: Apply version to manifests
        run: |
          set -euo pipefail
          NEXT="${{ steps.version.outputs.next }}"

          # Scoped to the [workspace.package] block rather than "first
          # version = line in the file", so an added section above it cannot
          # silently redirect the bump. The second rule catches the internal
          # crate versions in [workspace.dependencies]. [profile.release] has
          # no version key and is left alone.
          awk -v v="$NEXT" '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && /^version = / { print "version = \"" v "\""; next }
            /path = "crates\// { sub(/version = "[^"]*"/, "version = \"" v "\"") }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml

          # The member crates all use `version.workspace = true`, so the root
          # manifest is the only one to touch.

          # muxox is its own workspace member, so its version lives in
          # Cargo.lock too. --workspace rewrites only the local packages and
          # leaves every dependency pinned exactly where it is -- which
          # matters here, since the whole point is shipping a specific set of
          # audited dependency versions.
          cargo update --workspace

          cd npm && npm version "$NEXT" --no-git-tag-version --allow-same-version

      - name: Verify manifests agree
        run: |
          set -euo pipefail
          NEXT="${{ steps.version.outputs.next }}"

          CARGO=$(awk '
            /^\[workspace\.package\]/ { in_block = 1; next }
            /^\[/                     { in_block = 0 }
            in_block && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          NPM=$(node -p "require('./npm/package.json').version")

          if [ "$CARGO" != "$NEXT" ] || [ "$NPM" != "$NEXT" ]; then
            echo "::error::version mismatch after bump -- Cargo.toml=$CARGO npm=$NPM expected=$NEXT"
            exit 1
          fi
          echo "Cargo.toml, npm/package.json and Cargo.lock all at $NEXT"

      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          NEXT="${{ steps.version.outputs.next }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock npm/package.json
          git commit -m "chore(release): v$NEXT"

          # Annotated tag on the bump commit, not ahead of it.
          git tag -a "v$NEXT" -m "Release v$NEXT"

          # Push the commit before the tag. If the tag landed first, a
          # release build could check it out while master still lacked the
          # bump.
          git push origin HEAD:master
          git push origin "v$NEXT"

          echo "Tagged v$NEXT -- release.yml takes it from here."
          echo "### Released \`v$NEXT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bumped from \`${{ steps.version.outputs.current }}\`." >> "$GITHUB_STEP_SUMMARY"
