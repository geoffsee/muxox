name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust
        run: rustup update stable && rustup default stable

      - name: Tests
        shell: bash
        run: cargo test --all-features

      - name: Build Docs
        shell: bash
        run: |
          cargo doc -p muxox --no-deps

      # muxox ships as a single crate flattened out of this workspace. Build it
      # on every push so drift (a new module, a new dependency) is caught here
      # rather than on release day. Shares the cached target dir so dependency
      # artifacts are reused, but always drops staged muxox fingerprints: a
      # restored target/staged from an older publish/muxox can look "fresh" to
      # cargo while the rewritten tests already include newer struct fields.
      - name: Verify single-crate package
        shell: bash
        run: |
          ./scripts/stage-crates-io.sh
          cargo clean -p muxox --manifest-path publish/muxox/Cargo.toml --target-dir target/staged
          cargo clippy --manifest-path publish/muxox/Cargo.toml --all-targets --all-features \
            --target-dir target/staged -- -D warnings
          cargo test --manifest-path publish/muxox/Cargo.toml --target-dir target/staged
          cargo package --manifest-path publish/muxox/Cargo.toml --target-dir target/staged
