[package]
name = "muxox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A terminal-based service orchestrator and process multiplexer for development workflows"
documentation = "https://github.com/geoffsee/muxox"
readme = "../../README.md"
keywords = ["terminal", "tui", "multiplexer", "development", "process-manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
muxox-core.workspace = true
muxox-web.workspace = true
tui-bridge.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dioxus-core = "0.7"
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
self-replace = "1.5"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.0"
nix = { version = "0.31", features = ["signal", "process"] }

[features]
unix = []
